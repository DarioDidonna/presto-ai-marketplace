name: Test

# Sui rami la CI parte dalla PR; il push la fa partire solo su main (dopo il merge).
# Prima girava due volte per ogni PR: una per il push sul ramo e una per la PR.
on:
  push:
    branches: [main]
  pull_request:

# Il token del workflow può solo leggere il repository
permissions:
  contents: read

# Un nuovo push sullo stesso ramo annulla l'esecuzione precedente ancora in corso
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (${{ matrix.database }})
    runs-on: ubuntu-latest

    # SQLite in memoria è veloce; MySQL è il database vero del progetto e l'unico con i lock sulle righe
    # (il test sugli acquisti simultanei gira solo lì)
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: presto_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=3s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo, mbstring, pdo_sqlite, pdo_mysql
          # PCOV solo nel job MySQL, il più completo (include il test sugli acquisti simultanei)
          coverage: ${{ matrix.database == 'mysql' && 'pcov' || 'none' }}

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Le viste usano @vite: senza il build (o il dev server) i test non possono renderizzarle
      - name: Dipendenze e build front-end
        run: |
          npm ci
          npm run build

      - name: Configurazione
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite in memoria e Scout "collection"; le variabili qui sotto lo sostituiscono con MySQL.
      # Su MySQL nessun test può essere saltato: il test sugli acquisti simultanei deve girare davvero
      - name: Test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'presto_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            vendor/bin/phpunit --fail-on-skipped --coverage-text=coverage.txt --only-summary-for-coverage-text
          else
            php artisan test
          fi

      # Percentuale di righe coperte nel riepilogo della CI; sotto la soglia il job fallisce
      - name: Copertura (soglia 90%)
        if: matrix.database == 'mysql'
        run: |
          lines=$(grep -oE 'Lines: +[0-9.]+%' coverage.txt | grep -oE '[0-9.]+')
          echo "### Copertura PHP: ${lines}% delle righe (soglia 90%)" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Classes|Methods|Lines' coverage.txt | sed 's/^ */- /' >> "$GITHUB_STEP_SUMMARY"
          awk -v l="$lines" 'BEGIN { exit (l + 0 < 90) }'

  pint:
    name: Stile del codice (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  larastan:
    name: Analisi statica (Larastan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Livello e cartelle in phpstan.neon; Larastan legge le migrazioni per conoscere le colonne dei modelli
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  agent:
    name: Agente AI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv installa da solo il Python indicato in .python-version (3.12)
      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ai-agent/uv.lock

      - name: Dipendenze (versioni bloccate da uv.lock)
        run: uv sync --locked

      # I test usano un modello e un Laravel finti: Ollama non serve. Copertura con soglia 90%
      - name: Test
        run: |
          uv run pytest --cov=presto_ai_agent --cov-report=term --cov-fail-under=90
          echo "### Copertura Python: $(uv run coverage report --format=total)% delle istruzioni (soglia 90%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stile (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  audit:
    name: Vulnerabilità note nelle dipendenze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer
        run: composer audit --locked --no-interaction

      - name: npm
        run: npm audit

      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Python
        working-directory: ai-agent
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt

  docker:
    name: Avvio con Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lo stesso comando del README, senza Ollama: sito, coda, Reverb, MySQL e agente (volti)
      - name: Build e avvio
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Il sito risponde con gli annunci demo
        run: |
          curl -fsS http://localhost:8000/up -o /dev/null
          curl -fsS http://localhost:8000/annunci | grep -q '/storage/articles/'

      - name: L'agente controlla i volti di tutte le foto demo
        run: |
          for attempt in $(seq 1 30); do
            left=$(docker compose exec -T -e HOME=/tmp app php artisan tinker --execute 'echo App\Models\Image::whereNull("faces_count")->count();')
            [ "$left" = "0" ] && exit 0
            sleep 2
          done
          echo "Foto ancora da controllare: $left" && exit 1

      - name: Log dei container
        if: failure()
        run: docker compose logs --tail=80

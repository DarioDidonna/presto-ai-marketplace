# Aggiornamenti automatici delle dipendenze. Le correzioni di sicurezza arrivano subito (impostazione del
# repository); qui gli aggiornamenti ordinari, una volta a settimana e raggruppati: una PR per ecosistema con
# minor e patch, le major a parte perché possono rompere qualcosa. Ogni PR passa dalla CI come le altre.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /ai-agent
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        update-types: [minor, patch]

  # Azioni fissate per commit (SHA): Dependabot aggiorna SHA e commento della versione
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # Immagini di base dei Dockerfile e di compose.yaml (MySQL, Ollama)
  - package-ecosystem: docker
    directories: [/, /ai-agent]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # PHP come in composer.json e nella CI (8.4): si cambia insieme, a mano, non solo nell'immagine
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Node solo versioni LTS (22 ora): le dispari come la 25 non lo sono mai; si passa a mano alla prossima LTS
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # MySQL 8.4 è la versione LTS ed è quella della CI: solo le patch (8.4.x)
      - dependency-name: mysql
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      compose:
        update-types: [minor, patch]
